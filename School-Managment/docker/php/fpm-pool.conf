; Loaded after the image's www.conf and zz-docker.conf
[www]

; Keep the container environment (the .env values passed by compose) visible to PHP
clear_env = no

; Each login hashes with argon2id (64 MB), so keep the number of workers moderate
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
