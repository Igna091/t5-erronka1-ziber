; Loaded after php.ini-production

; Don't reveal the PHP version (X-Powered-By header)
expose_php = Off

; The code inside the image never changes, so OPcache doesn't check file timestamps.
; After running artisan cache commands by hand, restart the container: docker compose restart app
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
