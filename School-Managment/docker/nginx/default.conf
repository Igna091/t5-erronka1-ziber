# nginx in front of PHP-FPM ("app" container).
# This container only holds public/, so .env, the database, the logs and the code can't be served.

# Docker's DNS: find "app" again if its container is recreated with a new IP
resolver 127.0.0.11 valid=10s ipv6=off;

server_tokens off;

# HTTP only redirects to HTTPS
server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # docker/certs/ on the host; a self-signed pair is generated there if it's empty
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Plain http:// sent to port 443 (e.g. http://host:443) is redirected instead of answering 400
    error_page 497 =301 https://$host$request_uri;

    root  /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 10m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Laravel's front controller: the only PHP file that is executed.
    # Laravel adds the security headers (CSP, HSTS, X-Frame-Options...) to these responses.
    location = /index.php {
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Static files (public/css, public/js, public/images)
    location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
        # Compress only static files: compressing pages with CSRF tokens enables BREACH
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # No other PHP file is ever executed
    location ~ \.php$ {
        return 404;
    }

    # Hidden files (.htaccess, .env, .git...)
    location ~ /\. {
        return 404;
    }
}
